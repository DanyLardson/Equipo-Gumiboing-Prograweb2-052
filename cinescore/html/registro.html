<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crear cuenta — CineScore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="registro" style="background:var(--bg-main); min-height:100vh;">

<div class="navbar">
  <span class="logo">Cine<span>Score</span></span>
  <div class="navbar-right">
    <span style="color:var(--text-muted); font-size:13px;">¿Ya tienes cuenta?</span>
    <a href="login.html" style="color:var(--accent-gold); font-size:13px; font-weight:600;">Inicia sesión</a>
  </div>
</div>

<div style="display:flex; justify-content:center; align-items:center; min-height:calc(100vh - 68px); padding:24px;">
  <div class="card" style="width:100%; max-width:400px;">
    <h2 style="text-align:center; margin-bottom:24px;">Únete a CineScore</h2>

    <form id="registro-form">
      <div class="field">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" placeholder="tu_usuario" required>
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu_correo@mail.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••••" required>
      </div>
      <div class="field">
        <label for="password2">Confirmar contraseña</label>
        <input type="password" id="password2" name="password2" placeholder="••••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Crear cuenta</button>
    </form>
  </div>
</div>

<script src="../js/main.js"></script>
<script>
  //reemplaza con POST /api/auth/registro { username, email, password }
  document.getElementById('registro-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    if (p1 !== p2) {
      alert('Las contraseñas no coinciden.');
      return;
    }
    window.location.href = 'explorar.html';
  });
</script>
</body>
</html>
