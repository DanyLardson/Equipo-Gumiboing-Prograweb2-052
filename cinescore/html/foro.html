<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Foro — CineScore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="foros">

<div class="navbar">
  <span class="logo">Cine<span>Score</span></span>
  <nav>
   <a href="explorar.html" data-page="explorar">Inicio</a>
    <a href="foros.html" data-page="foros">Foros</a>
    <a href="buscar-amigos.html" data-page="amigos">Amigos</a>
    <a href="chat.html" data-page="chat">Chat</a>
    <a href="perfil.html" data-page="perfil">Perfil</a>
  </nav>
</div>

<h1 class="page-title" id="titulo-foro"></h1>

<div class="container" style="max-width:960px;">
  <a id="volver" href="foros.html" style="display:inline-flex; align-items:center; gap:6px; color:#7a7a72; font-size:13px; margin-bottom:18px;">
    <i class="ti ti-arrow-left" aria-hidden="true"></i> <span>Volver a foros</span>
  </a>

  <div class="dark-panel" style="padding:36px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:22px;">
      <span id="chip-pelicula" class="chip" style="cursor:default; background:var(--bg-surface-2); color:var(--text-muted);"></span>
      <span id="total-respuestas" style="color:var(--text-faint); font-size:12px;"></span>
    </div>

    <div style="display:flex; gap:16px; padding-bottom:22px; border-bottom:1px solid var(--border-dark);">
      <div id="avatar-foro" style="flex-shrink:0;"></div>
      <div style="flex:1;">
        <p style="font-weight:600; margin:0; font-size:15px;">
          <span id="autor-foro"></span><span id="fecha-foro" style="color:var(--text-faint); font-weight:400; font-size:13px;"></span>
        </p>
        <p id="descripcion-foro" style="color:#d5d5de; font-size:15px; line-height:1.6; margin:10px 0 0;"></p>
      </div>
    </div>

    <div id="mensajes"></div>

    <form id="foro-form" style="display:flex; gap:12px; margin-top:26px; padding-top:22px; border-top:1px solid var(--border-dark);">
      <input type="text" id="texto-respuesta" maxlength="1000" required placeholder="Escribe tu respuesta..." style="flex:1; padding:13px 18px; border-radius:24px; border:1px solid var(--border-dark); background:var(--bg-surface); color:#fff; font-size:14px;">
      <button type="submit" class="btn btn-primary" style="padding:13px 24px;">Responder</button>
    </form>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/likes.js"></script>
<script src="../js/foro.js"></script>
</body>
</html>
