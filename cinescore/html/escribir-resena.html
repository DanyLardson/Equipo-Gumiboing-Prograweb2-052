<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Escribir reseña — CineScore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="explorar">

<div class="navbar">
  <span class="logo">Cine<span>Score</span></span>
  <nav>
       <a href="explorar.html" data-page="explorar">Inicio</a>
    <a href="foros.html" data-page="foros">Foros</a>
    <a href="buscar-amigos.html" data-page="amigos">Amigos</a>
    <a href="chat.html" data-page="chat">Chat</a>
    <a href="perfil.html" data-page="perfil">Perfil</a>
  </nav>
</div>

<h1 class="page-title">Escribir una reseña</h1>

<div class="container" style="max-width:700px;">
  <div class="card">
    <h3 style="font-size:17px; margin-bottom:20px;">Parásitos (2019)</h3>

    <form id="resena-form">
      <div class="field">
        <label>Tu calificación</label>
        <div class="star-input" data-value="4">
          <i class="ti ti-star-filled filled"></i>
          <i class="ti ti-star-filled filled"></i>
          <i class="ti ti-star-filled filled"></i>
          <i class="ti ti-star-filled filled"></i>
          <i class="ti ti-star"></i>
        </div>
      </div>

      <div class="field">
        <label for="titulo">Título de tu reseña</label>
        <input type="text" id="titulo" placeholder="Es la historia de mi vida.">
      </div>

      <div class="field">
        <label for="texto">Tu reseña</label>
        <textarea id="texto" placeholder="Escribe aquí lo que pensaste de la película, sin spoilers si es posible..."></textarea>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <p style="font-size:12px; color:#8a8a86; font-style:italic; margin:0;">Cualquier usuario registrado puede publicar de inmediato</p>
        <button type="submit" class="btn btn-primary">Publicar reseña</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/stars.js"></script>
<script>
  //reemplaza con POST /api/resenas { peliculaId, calificacion, titulo, texto }
  document.getElementById('resena-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const calificacion = document.querySelector('.star-input').dataset.value;
    if (!calificacion || calificacion === '0') {
      alert('Selecciona una calificación antes de publicar.');
      return;
    }
    window.location.href = 'detalle.html';
  });
</script>
</body>
</html>
