<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar sesión — CineScore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="login" style="background:var(--bg-main); min-height:100vh;">

<div class="navbar">
  <span class="logo">Cine<span>Score</span></span>
  <div class="navbar-right">
    <span style="color:var(--text-muted); font-size:13px;">¿No tienes cuenta?</span>
    <a href="registro.html" style="color:var(--accent-gold); font-size:13px; font-weight:600;">Regístrate</a>
  </div>
</div>

<div style="display:flex; justify-content:center; align-items:center; min-height:calc(100vh - 68px); padding:24px;">
  <div class="card" style="width:100%; max-width:380px;">
    <h2 style="text-align:center; margin-bottom:24px;">Bienvenido de nuevo</h2>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu_correo@mail.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Iniciar sesión</button>
      <p style="text-align:center; font-size:12px; color:#8a8a86; margin-top:14px;">
        Al continuar aceptas nuestros términos de uso
      </p>
    </form>
  </div>
</div>

<script src="../js/main.js"></script>
<script>
  // TODO: reemplazar con POST /api/auth/login { email, password }
  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    window.location.href = 'explorar.html';
  });
</script>
</body>
</html>
