<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agregar película — CineScore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="explorar">

<div class="navbar">
  <span class="logo">Cine<span>Score</span></span>
  <nav>
    <a href="explorar.html" data-page="inicio">Inicio</a>
    <a href="explorar.html" data-page="explorar">Explorar</a>
    <a href="foros.html" data-page="foros">Foros</a>
    <a href="chat.html" data-page="chat">Chat</a>
    <a href="perfil.html" data-page="perfil">Perfil</a>
  </nav>
</div>

<h1 class="page-title">Agregar película o serie</h1>

<div class="container" style="max-width:700px;">
  <a href="explorar.html" style="display:inline-flex; align-items:center; gap:6px; color:#7a7a72; font-size:13px; margin-bottom:16px;">
    <i class="ti ti-arrow-left" aria-hidden="true"></i> Volver a explorar
  </a>

  <div class="card">
    <form id="agregar-pelicula-form">
      <div class="field">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" placeholder="Ej. Interstellar" required>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="field">
          <label for="anio">Año de estreno</label>
          <input type="number" id="anio" placeholder="2014" min="1900" max="2100" required>
        </div>
        <div class="field">
          <label for="director">Director</label>
          <input type="text" id="director" placeholder="Christopher Nolan" required>
        </div>
      </div>

      <div class="field">
        <label for="genero">Género principal</label>
        <select id="genero" required>
          <option value="" disabled selected>Selecciona un género...</option>
          <option value="drama">Drama</option>
          <option value="ciencia-ficcion">Ciencia ficción</option>
          <option value="comedia">Comedia</option>
          <option value="suspenso">Suspenso</option>
          <option value="animacion">Animación</option>
          <option value="terror">Terror</option>
        </select>
      </div>

      <div class="field">
        <label for="poster">URL del póster</label>
        <input type="url" id="poster" placeholder="https://...">
      </div>

      <div class="field">
        <label for="sinopsis">Sinopsis</label>
        <textarea id="sinopsis" placeholder="Breve resumen de la película, sin spoilers..."></textarea>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <p style="font-size:12px; color:#8a8a86; font-style:italic; margin:0;">El título quedará disponible de inmediato para reseñas y foros</p>
        <button type="submit" class="btn btn-primary">Agregar película</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/main.js"></script>
<script>
  // TODO: reemplazar con POST /api/peliculas { titulo, anio, director, genero, posterUrl, sinopsis }
  document.getElementById('agregar-pelicula-form').addEventListener('submit', (e) => {
    e.preventDefault();
    window.location.href = 'explorar.html';
  });
</script>
</body>
</html>
