<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Perfil — CineScore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="perfil">

<div class="navbar">
  <span class="logo">Cine<span>Score</span></span>
  <nav>
   <a href="explorar.html" data-page="explorar">Inicio</a>
    <a href="foros.html" data-page="foros">Foros</a>
    <a href="buscar-amigos.html" data-page="amigos">Amigos</a>
    <a href="chat.html" data-page="chat">Chat</a>
    <a href="perfil.html" data-page="perfil">Perfil</a>
  </nav>
</div>

<h1 class="page-title">Perfil de usuario</h1>

<div class="container" style="display:grid; grid-template-columns:280px 1fr; gap:32px; align-items:start;">

  <div class="card" style="text-align:center;">
    <div id="avatar" style="width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg,var(--accent-red),var(--accent-gold)); margin:0 auto 14px;"></div>
    <h3 id="username" style="font-size:18px;"></h3>
    <p id="bio" style="color:#7a7a72; font-size:13px; font-style:italic; margin:4px 0 18px;"></p>

    <div style="display:flex; justify-content:space-around; margin-bottom:20px;">
      <div><p id="stat-resenas" style="font-size:20px; font-weight:700; color:var(--accent-red); margin:0;">0</p><p style="font-size:12px; color:#7a7a72; margin:2px 0 0;">Reseñas</p></div>
      <div><p id="stat-comentarios" style="font-size:20px; font-weight:700; color:var(--accent-red); margin:0;">0</p><p style="font-size:12px; color:#7a7a72; margin:2px 0 0;">Comentarios</p></div>
      <div><p id="stat-likes" style="font-size:20px; font-weight:700; color:var(--accent-red); margin:0;">0</p><p style="font-size:12px; color:#7a7a72; margin:2px 0 0;">Likes recibidos</p></div>
    </div>

    <button id="btn-editar" class="btn btn-dark btn-full">Editar perfil</button>

    <form id="form-perfil" hidden style="margin-top:14px; text-align:left;">
      <div class="field">
        <label for="input-bio">Biografía</label>
        <textarea id="input-bio" maxlength="300" placeholder="Cuéntanos de ti..."></textarea>
      </div>
      <div class="field">
        <label for="input-avatar">URL de tu foto</label>
        <input type="url" id="input-avatar" placeholder="https://...">
      </div>
      <div style="display:flex; gap:8px;">
        <button type="submit" class="btn btn-primary" style="flex:1;">Guardar</button>
        <button type="button" id="btn-cancelar" class="btn btn-outline" style="flex:1;">Cancelar</button>
      </div>
    </form>

    <a href="buscar-amigos.html" class="btn btn-outline btn-full" style="margin-top:10px;">
      <i class="ti ti-user-plus" aria-hidden="true"></i> Buscar amigos
    </a>
    <button id="btn-logout" class="btn btn-outline btn-full" style="margin-top:10px;">
      <i class="ti ti-logout" aria-hidden="true"></i> Cerrar sesión
    </button>
  </div>

  <div>
    <h3 style="font-size:18px; margin-bottom:14px;">Reseñas recientes</h3>
    <div id="recientes"></div>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/perfil.js"></script>

</body>
</html>
