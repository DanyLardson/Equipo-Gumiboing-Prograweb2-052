<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chat — CineScore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  .chat-bubble{ max-width:65%; padding:12px 18px; border-radius:16px; font-size:14px; line-height:1.5; margin-bottom:10px; }
  .chat-bubble.incoming{ background:var(--bg-surface-2); color:#fff; align-self:flex-start; }
  .chat-bubble.outgoing{ background:var(--accent-red); color:#fff; align-self:flex-end; }
  .friend-item{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; cursor:pointer; }
  .friend-item:hover{ background:var(--bg-surface-2); }
  .friend-item.active{ background:var(--bg-surface-2); }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.online{ background:#639922; }
  .dot.offline{ background:#5f5e5a; }
</style>
</head>
<body data-page="chat">

<div class="navbar">
  <span class="logo">Cine<span>Score</span></span>
  <nav>
     <a href="explorar.html" data-page="explorar">Inicio</a>
    <a href="foros.html" data-page="foros">Foros</a>
    <a href="buscar-amigos.html" data-page="amigos">Amigos</a>
    <a href="chat.html" data-page="chat">Chat</a>
    <a href="perfil.html" data-page="perfil">Perfil</a>
  </nav>
</div>

<h1 class="page-title">Mensajes</h1>

<div class="container" style="max-width:1100px;">
  <div class="dark-panel" style="display:grid; grid-template-columns:290px 1fr; min-height:640px;">

    <div style="border-right:1px solid var(--border-dark); padding:24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <span style="font-weight:600; font-size:15px;">Amigos</span>
        <a href="buscar-amigos.html" class="icon-btn" title="Buscar amigos"><i class="ti ti-user-plus" aria-hidden="true"></i></a>
      </div>

      <div id="lista-amigos"></div>
    </div>

    <div style="display:flex; flex-direction:column; padding:26px 30px;">
      <div style="display:flex; align-items:center; gap:12px; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--border-dark);">
        <div id="chat-avatar"><div class="avatar" style="width:40px; height:40px;"></div></div>
        <p style="font-weight:600; margin:0; font-size:15px;">
          <span id="chat-with-name">Selecciona un amigo</span>
        </p>
      </div>

      <div id="chat-thread" style="flex:1; display:flex; flex-direction:column; overflow-y:auto; margin-bottom:18px; min-height:380px;">
        <p style="color:var(--text-muted); font-size:13px;">Elige a un amigo de la lista para empezar a chatear.</p>
      </div>

      <form id="chat-form" style="display:flex; gap:12px;">
        <input id="chat-input" type="text" maxlength="1000" disabled placeholder="Escribe un mensaje..."
          style="flex:1; padding:13px 18px; border-radius:24px; border:1px solid var(--border-dark); background:var(--bg-surface); color:#fff; font-size:14px;">
        <button id="chat-enviar" type="submit" disabled class="btn btn-dark" style="background:var(--accent-gold); color:#1e1e2e; border-radius:50%; width:44px; height:44px; padding:0; flex-shrink:0;">
          <i class="ti ti-send" aria-hidden="true"></i>
        </button>
      </form>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/chat.js"></script>
</body>
</html>
