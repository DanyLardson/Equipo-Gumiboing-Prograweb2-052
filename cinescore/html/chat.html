<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chat — CineScore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  .chat-bubble{ max-width:65%; padding:12px 18px; border-radius:16px; font-size:14px; line-height:1.5; margin-bottom:10px; }
  .chat-bubble.incoming{ background:var(--bg-surface-2); color:#fff; align-self:flex-start; }
  .chat-bubble.outgoing{ background:var(--accent-red); color:#fff; align-self:flex-end; }
  .friend-item{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; cursor:pointer; }
  .friend-item:hover{ background:var(--bg-surface-2); }
  .friend-item.active{ background:var(--bg-surface-2); }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.online{ background:#639922; }
  .dot.offline{ background:#5f5e5a; }
</style>
</head>
<body data-page="chat">

<div class="navbar">
  <span class="logo">Cine<span>Score</span></span>
  <nav>
     <a href="explorar.html" data-page="explorar">Inicio</a>
    <a href="foros.html" data-page="foros">Foros</a>
    <a href="buscar-amigos.html" data-page="amigos">Amigos</a>
    <a href="chat.html" data-page="chat">Chat</a>
    <a href="perfil.html" data-page="perfil">Perfil</a>
  </nav>
</div>

<h1 class="page-title">Mensajes</h1>

<div class="container" style="max-width:1100px;">
  <div class="dark-panel" style="display:grid; grid-template-columns:290px 1fr; min-height:640px;">

    <div style="border-right:1px solid var(--border-dark); padding:24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <span style="font-weight:600; font-size:15px;">Amigos</span>
        <a href="buscar-amigos.html" class="icon-btn" title="Buscar amigos"><i class="ti ti-user-plus" aria-hidden="true"></i></a>
      </div>

      <div class="friend-item active" data-name="Oshowot">
        <div class="avatar" style="width:38px; height:38px;"></div>
        <span style="flex:1; font-size:14px;">Oshowot</span>
        <span class="dot online"></span>
      </div>
      <div class="friend-item" data-name="The Iconic Dany">
        <div class="avatar" style="width:38px; height:38px;"></div>
        <span style="flex:1; font-size:14px; color:var(--text-muted);">The Iconic Dany</span>
        <span class="dot offline"></span>
      </div>
      <div class="friend-item" data-name="Mirjona">
        <div class="avatar" style="width:38px; height:38px;"></div>
        <span style="flex:1; font-size:14px; color:var(--text-muted);">Mirjona</span>
        <span class="dot online"></span>
      </div>
      <div class="friend-item" data-name="rollo_35mm">
        <div class="avatar" style="width:38px; height:38px;"></div>
        <span style="flex:1; font-size:14px; color:var(--text-muted);">rollo_35mm</span>
        <span class="dot online"></span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; padding:26px 30px;">
      <div style="display:flex; align-items:center; gap:12px; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--border-dark);">
        <div class="avatar" style="width:40px; height:40px;"></div>
        <p style="font-weight:600; margin:0; font-size:15px;">
          <span id="chat-with-name">Oshowot</span><br>
          <span style="color:#639922; font-weight:400; font-size:12px;">en línea</span>
        </p>
      </div>

      <div id="chat-thread" style="flex:1; display:flex; flex-direction:column; overflow-y:auto; margin-bottom:18px; min-height:380px;">
        <div class="chat-bubble incoming">¿Ya viste Dune 2?</div>
        <div class="chat-bubble outgoing">Sí, le puse 4 estrellas</div>
        <div class="chat-bubble incoming">Yo le hubiera dado 5 jaja</div>
        <div class="chat-bubble incoming">La fotografía de Greig Fraser es una locura</div>
        <div class="chat-bubble outgoing">Totalmente, el diseño de sonido también</div>
      </div>

      <form id="chat-form" style="display:flex; gap:12px;">
        <input id="chat-input" type="text" placeholder="Escribe un mensaje..."
          style="flex:1; padding:13px 18px; border-radius:24px; border:1px solid var(--border-dark); background:var(--bg-surface); color:#fff; font-size:14px;">
        <button type="submit" class="btn btn-dark" style="background:var(--accent-gold); color:#1e1e2e; border-radius:50%; width:44px; height:44px; padding:0; flex-shrink:0;">
          <i class="ti ti-send" aria-hidden="true"></i>
        </button>
      </form>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/chat.js"></script>
</body>
</html>
