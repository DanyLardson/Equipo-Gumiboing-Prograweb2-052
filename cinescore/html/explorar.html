<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Explorar títulos — CineScore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="explorar">

<div class="navbar">
  <span class="logo">Cine<span>Score</span></span>
  <nav>
       <a href="explorar.html" data-page="explorar">Inicio</a>
    <a href="foros.html" data-page="foros">Foros</a>
    <a href="buscar-amigos.html" data-page="amigos">Amigos</a>
    <a href="chat.html" data-page="chat">Chat</a>
    <a href="perfil.html" data-page="perfil">Perfil</a>
  </nav>
</div>

<h1 class="page-title">Explorar títulos</h1>

<div class="container">
  <div style="display:flex; gap:12px; margin-bottom:6px;">
    <input type="text" id="buscador" placeholder="Buscar película o serie..."
      style="flex:1; padding:14px 18px; border-radius:24px; border:1px solid #d8d6cc; background:#fff; font-size:14px;">
    <a href="agregar-pelicula.html" class="btn btn-dark" style="white-space:nowrap;">
      <i class="ti ti-plus" aria-hidden="true"></i> Agregar película
    </a>
  </div>

  <div class="chips">
    <button class="chip active" data-genero="Todos">Todos</button>
    <button class="chip" data-genero="Drama">Drama</button>
    <button class="chip" data-genero="Ciencia ficción">Ciencia ficción</button>
    <button class="chip" data-genero="Comedia">Comedia</button>
    <button class="chip" data-genero="Suspenso">Suspenso</button>
    <button class="chip" data-genero="Terror">Terror</button>
    <button class="chip" data-genero="Acción">Acción</button>
    <button class="chip" data-genero="Animación">Animación</button>
  </div>

  <div class="movie-grid" id="movie-grid">
   
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/explorar.js"></script>
</body>
</html>
